<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Silver/Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="adminShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#adminBg)" />
  
  <!-- Subtle High-Tech Glowing Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="180" r="140" fill="#10b981" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Center Shield / Security Control Icon -->
  <g filter="url(#adminShadow)">
    <!-- Outer Shield Frame -->
    <path d="M256 90 L370 140 C370 250 256 320 256 320 C256 320 142 250 142 140 Z" fill="url(#shieldGrad)" />
    <!-- Inner Shield Inset -->
    <path d="M256 108 L352 150 C352 242 256 302 256 302 C256 302 160 242 160 150 Z" fill="#0f172a" opacity="0.85" />
    
    <!-- Warehouse Control Center Grid / Key Symbol Inside Shield -->
    <!-- Control Sliders / Gate Bars -->
    <g fill="none" stroke="url(#steelGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="205" y1="165" x2="307" y2="165" />
      <line x1="205" y1="200" x2="307" y2="200" />
      <line x1="205" y1="235" x2="307" y2="235" />
    </g>

    <!-- Glowing Nodes on Sliders -->
    <circle cx="230" cy="165" r="9" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <circle cx="285" cy="200" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="245" cy="235" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Crown / Master Admin Star Badge (Top Center) -->
  <g transform="translate(256, 80)" filter="url(#adminShadow)">
    <circle cx="0" cy="0" r="26" fill="url(#goldBadge)" stroke="#ffffff" stroke-width="3" />
    <!-- Star Icon -->
    <path d="M0 -14 L4 -4 L15 -4 L7 3 L10 13 L0 7 L-10 13 L-7 3 L-15 -4 L-4 -4 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Brand & Admin Typography -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PTN ADMIN</text>
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ศูนย์จัดการคลังสินค้า</text>
</svg>
